<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white'%3E台%3C/text%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="assets/xlsx.full.min.js"></script>
<script src="assets/echarts.min.js"></script>
<script src="assets/pptxgen.bundle.js"></script>
<script src="assets/seed.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e8ebf0; --text:#1f2937; --sub:#6b7280;
    --blue:#2563eb; --primary:#2563eb; --blue-soft:#eff6ff; --green:#16a34a; --orange:#ea580c; --red:#dc2626;
    --radius:12px;
  }
  [data-theme="dark"]{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --sub:#94a3b8;
    --blue:#60a5fa; --primary:#3b82f6; --blue-soft:#1e3a5f; --green:#34d399; --orange:#fb923c; --red:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
  .layout{display:flex;min-height:100vh}

  /* ===== 侧边栏 ===== */
  .sidebar{width:200px;background:var(--card);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
  .logo{font-size:17px;font-weight:700;color:var(--blue);padding:0 20px 16px;display:flex;align-items:center;gap:8px}
  .logo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .nav-group{font-size:11px;color:#9ca3af;padding:14px 20px 6px;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:9px 20px;cursor:pointer;color:var(--text);font-size:14px;border-left:3px solid transparent}
  .nav-item:hover{background:var(--blue-soft)}
  .nav-item.active{background:var(--blue-soft);color:var(--blue);border-left-color:var(--blue);font-weight:600}

  /* ===== 主区 ===== */
  .main{flex:1;padding:24px 28px;max-width:1200px}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .topbar h1{font-size:19px;font-weight:700}
  .topbar .date{color:var(--sub);font-size:13px;font-weight:400;margin-left:8px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text)}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.primary:hover{background:#1d4ed8}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}

  /* ===== 卡片 ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .label{font-size:12px;color:var(--sub)}
  .stat .num{font-size:26px;font-weight:700;margin-top:6px}
  .stat .num small{font-size:13px;font-weight:400;color:var(--sub)}
  .stat .hint{font-size:11px;color:#9ca3af;margin-top:4px}
  .km-item{cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:74px;text-align:center;transition:.15s}
  .km-item:hover{border-color:var(--primary)}
  .km-item.km-cur{background:var(--primary);border-color:var(--primary)}
  .km-item.km-cur .km-m,.km-item.km-cur .km-v{color:#fff}
  .km-item .km-m{font-size:12px;color:var(--sub)}
  .km-item .km-v{font-size:16px;font-weight:700;margin-top:2px}
  .km-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .km-bar{font-size:13px;font-weight:600;color:var(--ink)}

  .grid2{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .card h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .card h3 .meta{font-size:12px;color:#9ca3af;font-weight:400}
  .kv{margin:6px 0;font-size:14px}
  .kv b{display:inline-block;min-width:56px;color:var(--sub);font-weight:400}

  .progress-track{height:8px;background:#eef0f3;border-radius:4px;overflow:hidden;margin:10px 0 12px}
  .progress-bar{height:100%;background:var(--green);border-radius:4px;transition:width .3s}
  .task-line{font-size:13px;color:var(--text);margin:4px 0}
  .task-line.done{color:#9ca3af;text-decoration:line-through}
  .task-line .tag{font-size:11px;color:var(--orange);margin-left:6px}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{font-size:12px;color:var(--sub);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
  .pill.ok{background:#dcfce7;color:#15803d}
  .pill.wait{background:#fef3c7;color:#b45309}
  .pill.amt{background:#ffedd5;color:#c2410c}

  /* ===== 表单 ===== */
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
  .field.full{grid-column:1/-1}
  .empty{color:#9ca3af;text-align:center;padding:30px 0;font-size:13px}

  /* 地点多选 */
  .loc-pick{display:flex;flex-wrap:wrap;gap:8px}
  .loc-pick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px;color:#374151;cursor:pointer;background:#fff}
  .loc-pick input{display:none}
  .loc-pick label.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);font-weight:600}

  /* 汇报文案框 */
  .report-box{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:18px;font-size:14px;line-height:1.9;white-space:pre-wrap;font-family:Consolas,monospace}

  /* ===== Toast ===== */
  #toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
  #toast.show{opacity:.92}

  /* ===== 响应式 ===== */
  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}
    .logo{padding:8px 12px}
    .nav-group{display:none}
    .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:8px 12px}
    .nav-item.active{border-bottom-color:var(--blue)}
    .main{padding:16px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">个人工作台</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="toast"></div>

<script>
/* ================= 数据层（存本机 localStorage） ================= */
const KEY = "qingjian_workbench_v1";
const defaultData = () => ({
  workRecords: [],   // {date, content, location, done}
  weathers: [],      // {date, morning, afternoon, low, high}
  mileages: [],      // {date, km} 手动里程表读数
  fuelRecords: [],   // {date, amount, note} 加油记录(元)
  subsidies: [],     // {date, type, amount, note}
  weeklyTasks: [],   // {text, done, note}
  wageBatches: [],   // 临时工考勤批次 {id,name,range,kind,rate,totalDays,totalAmt,records:[{lao,name,village,days,amount}]}
  fertilizerUsage: [],  // 自营林肥料使用(吨)
  fertilizerIssue: [],  // 合作林肥料发放(袋)
  fertilizerStock: [],  // 肥料库存(袋)
  herbicideStock: [],   // 除草剂库存(箱)
  herbicideUsage: [],   // 除草剂使用明细(箱)
  herbicideList: [],    // 除草剂林班发放表
  burnRecords: [],      // 清点焚烧 {date,place,type,count,status,note}
  inspectRecords: [],   // 林场整改 {forest,point,issue,owner,foundDate,status,doneDate,note}
  seedlingRecords: [],  // 苗木成活率 {date,forest,block,area,unit,planted,survived,note}
  archiveRecords: [],   // 验收资料 {date,type,name,project,status,note}
  phrases: [],          // 常用语库 {text,category}
  seedlingUsage: [],    // 苗木使用 {region,forest,block,code,area,qty}
  workLogs: [],         // 工作日志 {date,place,mileage,content,weather}
  forestOwned: [],      // 林地台账-自营林 {region,forest,block,code,area,terrain,areaA..D,manager...}
  forestCoop: []        // 林地台账-合作林 {region,forest,county,village,farmer,mode,oldCode,newCode,area,year,manager...}
  ,
  contracts: [],        // 工序验收-合同库 {id,contractNo,areaName,farm,contractor,signDate,manager,siteOwner,note}
  acceptanceRecords: [], // 工序验收记录 {id,contractNo,orderNo,plotCode,location,process,areaName,farm,signDate,applyDate,contractArea,actualArea,startPlan,startActual,endPlan,endActual,acceptApplyDate,forestDeadline,onsiteDate,manager,siteOwner,contractor,signCheck1..3,rStart,rEnd,rForest,rOnsite,qualityResult,opinion,photoType,createdAt,files:[]}
  processes: []         // 用户自加作业工序 {n,c,r,s,a}
});
let DB = load();
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return Object.assign(defaultData(), JSON.parse(raw)); }catch(e){}
  return defaultData();
}
// 首次运行：合并预置业务数据（从 assets/seed.js，不覆盖用户已有数据）
(function(){
  const VER = 7;
  if(window.SEED_DATA && DB._seedVer !== VER){
    // 版本7：桌面软件版首次启动——迁移网页版完整数据（软件版带 assets/user-data.js，网页版无此文件自动跳过）
    if(window.USER_DATA){
      Object.keys(USER_DATA).forEach(k=>{ if(k==="_seedVer") return; DB[k] = USER_DATA[k]; });
      Object.keys(SEED_DATA).forEach(k=>{ if(!DB[k] || !Array.isArray(DB[k]) || !DB[k].length) DB[k] = SEED_DATA[k]; });
    }
    Object.keys(SEED_DATA).forEach(k=>{
      if(!DB[k]) DB[k] = [];
      if(!DB[k].length) DB[k] = SEED_DATA[k];
    });
    // 版本4：工作日志按日期补全缺失/空内容（合并用户历史手填记录，不覆盖已有内容）
    if(Array.isArray(DB.workLogs) && Array.isArray(SEED_DATA.workLogs)){
      const byDate = {};
      DB.workLogs.forEach(x=>{ byDate[x.date] = x; });
      SEED_DATA.workLogs.forEach(r=>{
        const ex = byDate[r.date];
        if(!ex){ DB.workLogs.push(Object.assign({}, r)); byDate[r.date] = DB.workLogs[DB.workLogs.length-1]; }
        else if(!ex.content && r.content){ ex.content = r.content; }
      });
    }
    // 版本5：每日工作记录合并进工作日志（内容补全 + 完成状态迁移），统一为一个板块
    if(Array.isArray(DB.workRecords) && DB.workRecords.length){
      const byDate = {};
      DB.workLogs.forEach(x=>{ byDate[x.date] = x; });
      DB.workRecords.forEach(r=>{
        if(!r.date || !(r.content||"").trim()) return;
        const ex = byDate[r.date];
        if(ex){
          if(!ex.content) ex.content = r.content;
          if(!ex.place && r.location) ex.place = r.location;
          if(r.done) ex.done = true;
        } else {
          DB.workLogs.push({date:r.date, place:r.location||"", mileage:"", content:r.content, weather:"", done:r.done?true:false});
          byDate[r.date] = DB.workLogs[DB.workLogs.length-1];
        }
      });
      DB.workLogs.sort((a,b)=>a.date.localeCompare(b.date));
    }
    // 版本6：里程双向同步的存量回填——摩托车里程板块已有读数的日期，补到工作日志当天（有记录才补，不创建空记录）
    if(Array.isArray(DB.mileages) && DB.mileages.length){
      const kmByDate = {};
      DB.mileages.forEach(m=>{ if(m.date && kmByDate[m.date]===undefined) kmByDate[m.date] = m.km; });
      (DB.workLogs||[]).forEach(r=>{
        if(!r.mileage && kmByDate[r.date] !== undefined) r.mileage = String(kmByDate[r.date]);
      });
    }
    delete DB.workRecords;
    DB._seedVer = VER; save();
  }
})();
function save(skipSync){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("保存失败：本地存储空间不足。请到「导出与导入」先导出备份，再清理旧数据后重试"); }
  if(!skipSync && cloudEnabled()) scheduleSync();
}
// PWA：Service Worker 注册（https 部署后生效，手机可离线打开）；启动时自动拉取云数据
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
setTimeout(()=>{ if(cloudEnabled()) doSync(true); }, 1200);
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("show"), 1800);
}
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthStr(){ return todayStr().slice(0,7); }
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtNum(n){ return String(Math.round(Number(n||0))).replace(/\B(?=(\d{3})+(?!\d))/g,","); }  // 基普千分位
// 每日工作记录与工作日志已合并：统一从 workLogs 读取（有内容才算一条记录）
function dayLogs(ds){ return (DB.workLogs||[]).filter(x=>x.date===ds && (x.content||x.place||x.mileage)); }
function hasDayLog(ds){ return dayLogs(ds).length > 0; }

/* ================= 导航配置 ================= */
const NAV = [
  {group:"快捷"},
  {hash:"#/home",   icon:"◈", label:"首页"},
  {hash:"#/report", icon:"✉", label:"每日汇报发微信"},
  {group:"记录"},
  {hash:"#/work",   icon:"☰", label:"每日工作记录"},
  {hash:"#/weather",icon:"☂", label:"天气记录"},
  {hash:"#/mileage",icon:"◎", label:"摩托车里程"},
  {group:"计划"},
  {hash:"#/plan",   icon:"▤", label:"本周工作计划"},
  {group:"生活"},
  {hash:"#/subsidy",icon:"¥", label:"就餐与补贴"},
  {group:"业务台账"},
  {hash:"#/wage",    icon:"工", label:"临时工考勤发薪"},
  {hash:"#/material",icon:"肥", label:"物资台账(肥料/除草剂)"},
  {hash:"#/forest",  icon:"林", label:"林地台账"},
  {hash:"#/burn",    icon:"焚", label:"清点焚烧登记"},
  {hash:"#/inspect", icon:"改", label:"林场整改台账"},
  {hash:"#/seedling",icon:"苗", label:"苗木成活率"},
  {hash:"#/acceptance",icon:"验", label:"工序验收表"},
  {hash:"#/archive", icon:"档", label:"验收资料台账"},
  {group:"总结"},
  {hash:"#/summary-month", icon:"▦", label:"月度总结"},
  {hash:"#/summary-year",  icon:"★", label:"年度总结"},
  {group:"工具"},
  {hash:"#/phrases", icon:"语", label:"常用语库"},
  {group:"数据"},
  {hash:"#/backup", icon:"⇪", label:"导出与导入"},
  {group:"系统"},
  {hash:"#/settings", icon:"⚙", label:"设置"},
];
function renderNav(){
  document.getElementById("nav").innerHTML = NAV.map(n=>{
    if(n.group) return `<div class="nav-group">${n.group}</div>`;
    const active = location.hash === n.hash ? "active" : "";
    return `<div class="nav-item ${active}" onclick="location.hash='${n.hash}'"><span>${n.icon}</span>${n.label}</div>`;
  }).join("");
}

/* ================= 统计计算 ================= */
function monthItems(arr){ const m = monthStr(); return arr.filter(x=>x.date && x.date.startsWith(m)); }
// —— 里程统一时间线：工作日志「车辆里程」+ 摩托车里程板块读数合并（同一里程表，同日取手动记录优先）——
function allKms(){
  const m = {};
  (DB.workLogs||[]).forEach(x=>{
    if(x.mileage){
      const km = parseFloat(String(x.mileage).replace(/[^\d.]/g,""));
      if(!isNaN(km) && km>0) m[x.date] = {date:x.date, km, src:"wl"};
    }
  });
  (DB.mileages||[]).forEach(x=>{
    const km = Number(x.km);
    if(!isNaN(km) && km>0) m[x.date] = {date:x.date, km, src:"mi"};
  });
  return Object.values(m).sort((a,b)=>a.date.localeCompare(b.date));
}
// 总里程=最新读数（合并时间线）
function totalKm(){
  const kms = allKms();
  return kms.length ? kms[kms.length-1].km : 0;
}
// 某月行驶 = 该月最后读数 - 该月之前最近一次读数（无上月则用该月第一条）
function monthKm(ym){
  const kms = allKms();
  const inMonth = kms.filter(x=>x.date.startsWith(ym));
  if(!inMonth.length) return 0;
  const last = inMonth[inMonth.length-1].km;
  const before = kms.filter(x=>x.date < ym+"-01");
  const base = before.length ? before[before.length-1].km : inMonth[0].km;
  return Math.max(0, last - base);
}
// 今年公里数：年初（1月1日）读数起，最新读数止
function yearKm(){
  const kms = allKms();
  if(!kms.length) return 0;
  return Math.max(0, kms[kms.length-1].km - kms[0].km);
}
function streakDays(){
  // 从今天往前数，连续有工作记录的天数
  let count = 0; const d = new Date();
  const dates = new Set((DB.workLogs||[]).filter(x=>x.content||x.place||x.mileage).map(x=>x.date));
  for(let i=0;i<365;i++){
    const ds = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(dates.has(ds)) count++; else if(i>0) break;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function weekRange(){
  const now = new Date(); const day = now.getDay()||7;
  const mon = new Date(now); mon.setDate(now.getDate()-day+1);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return {mon:f(mon), sun:f(sun)};
}

/* ================= 各视图渲染 ================= */
const view = document.getElementById("view");

function renderHome(){
  const mr = (DB.workLogs||[]).filter(x=>x.date && x.date.startsWith(monthStr()) && (x.content||x.place||x.mileage));
  const doneCnt = mr.filter(x=>x.done).length;
  const rate = mr.length ? Math.round(doneCnt/mr.length*100) : 0;
  const kmTotal = totalKm();
  const kmMonth = monthKm(monthStr());
  const sub = monthItems(DB.subsidies).reduce((s,x)=>s+Number(x.amount||0),0);
  const fuelM = (DB.fuelRecords||[]).filter(x=>x.date.startsWith(monthStr())).reduce((s,x)=>s+Number(x.amount||0),0);
  const fuelY = (DB.fuelRecords||[]).filter(x=>x.date.startsWith(monthStr().slice(0,4))).reduce((s,x)=>s+Number(x.amount||0),0);
  const st = streakDays();
  const t = todayStr();
  const todayWork = (DB.workLogs||[]).filter(x=>x.date===t && (x.content||x.place||x.mileage));
  const todayWx = DB.weathers.find(x=>x.date===t);

  // 最近7天
  let rows = "";

let kmFilter = "";  // 每月里程一览的选中月份（空=全部）
function renderMileage(){
  const kms = allKms();              // 合并时间线（升序：工作日志里程 + 手动读数）
  const desc = kms.slice().reverse();
  const cur = monthStr();
  // —— 每月里程一览（1~12月） ——
  const months = [];
  for(let m=1;m<=12;m++){ months.push(cur.slice(0,4)+"-"+String(m).padStart(2,"0")); }
  const kmRows = months.map(ym=>{
    const k = monthKm(ym);
    return `<div class="km-item ${ym===kmFilter?"km-cur":""}" onclick="kmFilter=(kmFilter==='${ym}')?'':'${ym}';renderMileage()" title="点击查看该月每日里程，再点取消">
      <div class="km-m">${+ym.split("-")[1]}月</div>
      <div class="km-v">${k?k.toFixed(0)+" km":"—"}</div></div>`;
  }).join("");
  // —— 里程表读数表（工作日志每日里程 + 手动补录，同一里程表） ——
  const rows = desc.filter(x=>!kmFilter || x.date.startsWith(kmFilter)).map((x,i)=>{
    const prev = kms[kms.length-2-i];          // 时间线上更早一条
    const diff = prev ? (x.km - prev.km).toFixed(1) : "—";
    const src = x.src==="mi"
      ? '<span class="pill" style="background:#eef2ff;color:#4f46e5">手动</span>'
      : '<span class="pill" style="background:#f0fdf4;color:#16a34a">日志</span>';
    const delBtn = x.src==="mi" ? `<button class="btn danger" onclick="delMileage('${x.date}')">删</button>` : "";
    return `<tr><td>${x.date}</td><td>${x.km.toFixed(1)} km</td><td>${diff}</td><td>${src}</td><td>${delBtn}</td></tr>`;
  }).join("");
  // —— 加油记录统计 ——
  const fuel = DB.fuelRecords||[];
  const fm = fuel.filter(x=>x.date.startsWith(cur)).reduce((s,x)=>s+Number(x.amount||0),0);
  const fy = fuel.filter(x=>x.date.startsWith(cur.slice(0,4))).reduce((s,x)=>s+Number(x.amount||0),0);
  const fCount = fuel.filter(x=>x.date.startsWith(cur.slice(0,4))).length;
  const fuelList = fuel.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>
    `<tr><td>${x.date}</td><td><span class="pill amt">₭${fmtNum(x.amount)}</span></td><td>${esc(x.note||"")}</td>
      <td><button class="btn danger" onclick="delRec('fuelRecords',${DB.fuelRecords.indexOf(x)})">删</button></td></tr>`).join("");
  view.innerHTML = `
    <div class="topbar"><h1>摩托车里程</h1></div>
    <div class="stats" style="margin-bottom:14px">
      <div class="stat"><div class="label">累计总里程</div><div class="num">${totalKm().toFixed(1)}<small> km</small></div></div>
      <div class="stat"><div class="label">本月行驶</div><div class="num">${monthKm(cur).toFixed(1)}<small> km</small></div></div>
      <div class="stat"><div class="label">今年公里数</div><div class="num">${yearKm().toFixed(1)}<small> km</small></div></div>
    </div>
    <div class="card">
      <div class="km-bar">加油记录
        <span style="float:right;font-weight:400;font-size:12px;color:var(--sub)">本月油费 <b style="color:var(--primary)">₭${fmtNum(fm)}</b> ｜ 年度油费 <b style="color:var(--primary)">₭${fmtNum(fy)}</b> ｜ 今年 ${fCount} 次</span>
      </div>
      <form onsubmit="addFuel(event)">
        <div class="field"><label>加油日期</label><input type="date" name="date" value="${todayStr()}" required></div>
        <div class="field"><label>加油金额 (基普)</label><input type="number" step="1" name="amount" required placeholder="如 100000"></div>
        <div class="field"><label>备注</label><input name="note" placeholder="选填，如：加满 92号 3.5升"></div>
        <div class="field" style="align-self:end"><button class="btn primary" type="submit">保存</button></div>
      </form>
      <table>
        <colgroup><col style="width:20%"><col style="width:20%"><col style="width:47%"><col style="width:13%"></colgroup>
        <tr><th>日期</th><th>金额</th><th>备注</th><th></th></tr>
        ${fuelList || '<tr><td colspan="4" class="empty">还没有加油记录，加一次油就记一笔吧</td></tr>'}
      </table>
    </div>
    <div class="card">
      <div class="km-bar">每月里程一览（点击月份可查看该月每日里程）</div>
      <div class="km-grid">${kmRows}</div>
    </div>
    <div class="card">

    </div>`;
}
/* 里程双向同步：任一板块填里程，另一板块自动补上（空值不覆盖已有数据） */
function syncKmBoth(date, km){
  if(!date || km==="" || km===null || km===undefined) return;
  const v = Number(km);
  if(!isNaN(v)){
    const ex = DB.mileages.findIndex(x=>x.date===date);
    if(ex>=0){ DB.mileages[ex].km = v; }
    else DB.mileages.push({date, km:v, note:""});
  }
  const lg = DB.workLogs.find(x=>x.date===date);
  if(lg && km!=="") lg.mileage = String(km);
}
function addMileage(e){
  e.preventDefault(); const f = e.target;
  const date = f.date.value, km = Number(f.km.value), note = (f.note.value||"").trim();
  const ex = DB.mileages.findIndex(x=>x.date===date);
  if(ex>=0){ DB.mileages[ex].km = km; if(note) DB.mileages[ex].note = note; }
  else DB.mileages.push({date, km, note});
  const lg = DB.workLogs.find(x=>x.date===date);
  if(lg) lg.mileage = String(km);
  save(); toast("已保存并同步到工作日志"); renderMileage();
}
function delMileage(date){
  if(!confirm("删除这条手动里程记录？")) return;
  DB.mileages = DB.mileages.filter(x=>x.date!==date);
  save(); toast("已删除"); renderMileage();
}
function addFuel(e){
  e.preventDefault(); const f = e.target;
  if(!DB.fuelRecords) DB.fuelRecords = [];
  DB.fuelRecords.push({date:f.date.value, amount:Number(f.amount.value), note:(f.note.value||"").trim()});
  save(); toast("已保存"); renderMileage();
}

function exportMonthExcel(){
  if(typeof XLSX === "undefined"){ alert("Excel 组件未加载，请确认 assets 文件夹和本页面在同一目录"); return; }
  const ym = document.getElementById("expMonth").value;
  if(!ym){ alert("请先选择月份"); return; }
  const [y,m] = ym.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const aoa = [];
  aoa.push(["考核部外勤工作日志"]);
  aoa.push([`姓名：刘琪伟`, `区域/岗位名称：合作部考核员`, `上级直接主管：杜国平`]);
  for(let d=1; d<=daysInMonth; d++){
    const col = (d-1) % 3;
    const rowBase = 2 + Math.floor((d-1)/3)*4;
    const ds = `${ym}-${String(d).padStart(2,"0")}`;
    const works = dayLogs(ds);
    const locSet = new Set(); works.forEach(x=>{ if(x.place) x.place.split(/[、,，]/).forEach(l=>l.trim()&&locSet.add(l.trim())); });
    const wx = DB.weathers.find(x=>x.date===ds);
    const mile = DB.mileages.filter(x=>x.date===ds).sort((a,b)=>b.km-a.km)[0];
    while(aoa.length < rowBase+4) aoa.push([]);
    aoa[rowBase][col] = `日期:${y} 年 ${m}月${d}日`;

/* ================= 云同步（GitHub 数据仓库，手机/电脑自动同步） ================= */
let syncTimer = null;
function cloudCfg(){ return (DB.settings && DB.settings.cloud) || {}; }
function cloudEnabled(){ const c = cloudCfg(); return !!(c.token && c.repo); }
function syncLast(){ const s = DB.settings && DB.settings.sync; return s ? (s.last||0) : 0; }
function scheduleSync(){
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 30000);
}
function ensureTs(){
  Object.keys(DB).forEach(k=>{ if(Array.isArray(DB[k])) DB[k].forEach(r=>{ if(r && typeof r==="object" && r._ts===undefined) r._ts = Date.now(); }); });
}
function recKey(r, coll){
  if(r && r.date) return "d:"+r.date;
  if(r && r.id) return "i:"+r.id;
  if(coll==="phrases") return "p:"+((r&&r.text)||"");
  if(coll==="wageBatches") return "w:"+((r&&r.name)||"");
  if(coll==="weeklyTasks") return "t:"+((r&&r.text)||"");
  return "x:"+JSON.stringify(r||{}).slice(0,40);
}
function syncMerge(local, remote){
  const out = {};
  Object.keys(local).forEach(k=>{
    if(k==="_seedVer" || k==="workRecords" || k==="settings"){ out[k] = local[k]; return; }
    const a = Array.isArray(local[k]) ? local[k] : null;
    const b = remote && Array.isArray(remote[k]) ? remote[k] : null;
    if(a===null && b===null){ out[k] = local[k]; return; }
    if(a===null){ out[k] = b; return; }
    if(b===null){ out[k] = a; return; }
    const m = new Map();
    a.forEach(r=>{ const kk=recKey(r,k); if(!m.has(kk)) m.set(kk, r); });
    b.forEach(r=>{
      const kk=recKey(r,k);
      const ex=m.get(kk);
      if(!ex) m.set(kk, r);
      else if(Number(r._ts||0) > Number(ex._ts||0)) m.set(kk, r);
    });
    out[k] = [...m.values()];
  });
  return out;
}
async function doSync(silent){
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
  if(!cloudEnabled()) return;
  const c = cloudCfg();
  const url = "https://api.github.com/repos/" + c.repo + "/contents/data.json";
  const headers = { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json" };
  try{
    ensureTs();
    const res = await fetch(url, { headers });
    let remote = null, sha = null;
    if(res.status === 200){
      const j = await res.json();
      sha = j.sha;
      try{ remote = JSON.parse(decodeURIComponent(escape(atob(j.content)))); }catch(e){ remote = null; }
    } else if(res.status !== 404){ if(!silent) toast("云同步拉取失败("+res.status+")"); return; }
    if(remote){
      const merged = syncMerge(DB, remote);
      const changed = JSON.stringify(merged) !== JSON.stringify(DB);
      Object.keys(merged).forEach(k=>{ DB[k] = merged[k]; });
      if(changed) save(true);
    }
    await pushData(sha);
    DB.settings = DB.settings || {}; DB.settings.sync = { last: Date.now() }; save(true);
    if(!silent) toast("云同步完成");
  }catch(err){ if(!silent) toast("云同步失败："+String(err.message||err).slice(0,40)); }
}
async function pushData(sha){
  const c = cloudCfg();
  const body = { message: "sync " + new Date().toISOString(), branch: c.branch || "main",
    content: btoa(unescape(encodeURIComponent(JSON.stringify(DB)))) };
  if(sha) body.sha = sha;
  const res = await fetch("https://api.github.com/repos/" + c.repo + "/contents/data.json", {
    method: "PUT",
    headers: { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  if(res.status !== 200 && res.status !== 201) throw new Error("上传失败 " + res.status);
}
function saveCloud(){
  const t = document.getElementById("ghToken").value.trim();
  let r = document.getElementById("ghRepo").value.trim().replace(/^https:\/\/github\.com\//,"").replace(/\/$/,"");
  const b = document.getElementById("ghBranch").value.trim() || "main";
  DB.settings = DB.settings || {}; DB.settings.cloud = { token: t, repo: r, branch: b };
  save(true);
  if(!t || !r){ toast("已保存（未启用：需填 Token 和仓库）"); renderSettings(); return; }
  fetch("https://api.github.com/repos/" + r, { headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" } })
    .then(res=>{ if(res.ok){ toast("连接成功，云同步已启用"); renderSettings(); doSync(true); } else toast("连接失败("+res.status+")：请检查 Token 权限和仓库名"); })
    .catch(()=>toast("网络错误：无法连接 GitHub"));
}

async function genAcceptance(editId){
  const data = collectAcceptance();
  if(!data.contractNo){ toast("请至少填写合同号（用于命名归档）"); return; }
  const missing = ["orderNo","plotCode","process","onsiteDate","qualityResult"].filter(k=>!data[k]);
  const run = async ()=>{
    if(!(window.wbNative && window.wbNative.isNative)){ toast("生成表格需要在桌面软件版中操作（手机版只做记录）"); return; }
    toast("正在生成验收表…");
    const r = await window.wbNative.generateAcceptance({ out_root: accDir(), data });
    if(r.ok && r.data){
      const rec = Object.assign({ id: Date.now(), createdAt: Date.now(), files: [r.data.xlsx, r.data.docx] }, data);
      if(editId){ const i = DB.acceptanceRecords.findIndex(x=>x.id===editId); if(i>=0) DB.acceptanceRecords[i] = rec; }
      else DB.acceptanceRecords.push(rec);
      accForm = { editId: null }; save(); renderAcceptance();
      toast("已生成：" + r.data.xlsx.replace(/\\/g,"/").split("/").slice(-3).join("/"));
    } else {
      toast("生成失败：" + (r.stderr ? r.stderr.replace(/\n/g," ").slice(0,60) : "请确认电脑已安装 Python"));
    }
  };
  const tip = missing.length ? ("以下字段未填，将留空或按“待补”生成，可生成后手动补充：\n" + missing.map(k=>({orderNo:"订单号",plotCode:"年份林代码",process:"作业工序",onsiteDate:"现场验收日期",qualityResult:"质量标准"})[k]).join("、") + "\n\n仍要生成吗？") : "生成后会写入本地文件夹，并保存到验收记录。继续？";
  if(!editId && !accForm.editId && confirm(tip)) await run();
  else await run();
}

function buildReport(dateStr){
  const works = dayLogs(dateStr);
  const locSet = new Set(); works.forEach(x=>{ if(x.place) x.place.split(/[、,，]/).forEach(l=>l.trim()&&locSet.add(l.trim())); });
  const locs = [...locSet].join("、");
  const wx = DB.weathers.find(x=>x.date===dateStr);
  const weatherTxt = wx ? `${wx.morning}转${wx.afternoon}` : "";
  const mile = DB.mileages.filter(x=>x.date===dateStr).sort((a,b)=>b.km-a.km)[0];
  const d = new Date(dateStr+"T00:00:00");
  const dateTxt = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  let lines = [];
  lines.push(`日期：${dateTxt}`);
  lines.push(`工作地点：${locs||"—"}${weatherTxt?`（${weatherTxt}）`:""}`);
  lines.push(`车辆里程：${mile?Number(mile.km).toFixed(0):"—"}`);
  lines.push(`主要工作内容：`);
  works.forEach((w,i)=>{ lines.push(`${i+1}、${w.content}`); });
  return lines.join("\n");
}

/* 把汇报内容画成表格图片 */
function drawReportImage(dateStr){
  const c = document.getElementById("reportCanvas");
  const dpr = 2; // 高清
  const W = 750;
  // 先算内容
  const works = dayLogs(dateStr);
  const locSet = new Set(); works.forEach(x=>{ if(x.place) x.place.split(/[、,，]/).forEach(l=>l.trim()&&locSet.add(l.trim())); });
  const locs = [...locSet].join("、");
  const wx = DB.weathers.find(x=>x.date===dateStr);
  const d = new Date(dateStr+"T00:00:00");
  const dateTxt = `${d.getFullYear()} 年 ${d.getMonth()+1}月${d.getDate()}日`;
  const mile = DB.mileages.filter(x=>x.date===dateStr).sort((a,b)=>b.km-a.km)[0];
  const rows = [
    ["日期", dateTxt],
    ["工作地点", locs+(wx?`（${wx.morning}${wx.afternoon&&wx.afternoon!==wx.morning?"转"+wx.afternoon:""}）`:"")],
    ["车辆里程", mile?Number(mile.km).toFixed(0)+" km":"—"],
    ["主要工作内容", works.map((w,i)=>`${i+1}、${w.content}`).join("\n")]
  ];
  // 计算高度
  const labelW = 130, pad = 18, lineH = 34;
  const fontSize = 18;
  let H = 60; // 顶部留白
  const ctx = c.getContext("2d");
  ctx.font = `${fontSize}px "Microsoft YaHei", sans-serif`;
  const rowHeights = rows.map(([label,text])=>{
    const maxW = W - labelW - pad*2;
    // 按换行+宽度折行
    const lines = [];
    String(text).split("\n").forEach(seg=>{
      let cur = "";
      for(const ch of seg){
        if(ctx.measureText(cur+ch).width > maxW){ lines.push(cur); cur = ch; }
        else cur += ch;
      }
      lines.push(cur);
    });
    return Math.max(lineH, lines.length*lineH);
  });
  H += rowHeights.reduce((a,b)=>a+b,0) + 40;
  c.width = W*dpr; c.height = H*dpr;
  c.style.height = H+"px";
  ctx.scale(dpr,dpr);
  ctx.font = `${fontSize}px "Microsoft YaHei", sans-serif`;
  // 背景
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = "#333"; ctx.lineWidth = 1.5;
  // 标题线外框
  ctx.strokeRect(10, 10, W-20, H-20);
  let y = 10;
  rows.forEach(([label,text],i)=>{
    const rh = rowHeights[i];
    // 标签列
    ctx.fillStyle = "#f3f4f6"; ctx.fillRect(10, y, labelW, rh);
    ctx.strokeStyle = "#333";
    // 横线
    ctx.beginPath(); ctx.moveTo(10,y+rh); ctx.lineTo(W-10,y+rh); ctx.stroke();
    // 竖线（标签列右边）
    ctx.beginPath(); ctx.moveTo(10+labelW,y); ctx.lineTo(10+labelW,y+rh); ctx.stroke();
    // 标签文字
    ctx.fillStyle = "#1f2937"; ctx.font = `bold ${fontSize}px "Microsoft YaHei", sans-serif`;
    ctx.fillText(label, 20, y+fontSize+10);
    // 内容文字（多行）
    ctx.font = `${fontSize}px "Microsoft YaHei", sans-serif`;
    ctx.fillStyle = "#1f2937";
    const maxW = W - labelW - pad*2 - 10;
    let cy = y + fontSize + 10;
    String(text).split("\n").forEach(seg=>{
      let cur="";
      for(const ch of seg){
        if(ctx.measureText(cur+ch).width > maxW){ ctx.fillText(cur, 10+labelW+pad, cy); cy += lineH; cur = ch; }
        else cur += ch;
      }
      ctx.fillText(cur, 10+labelW+pad, cy); cy += lineH;
    });
    y += rh;
  });
}

let chartInst = null;
function renderSummary(scope){
  const isMonth = scope==="month";
  const cur = isMonth ? monthStr() : todayStr().slice(0,4);
  view.innerHTML = `
    <div class="topbar">
      <h1>${isMonth?"月度总结":"年度总结"}</h1>

        <button class="btn primary" onclick="exportPPT('${scope}')">导出 PPT</button>
      </div>
    </div>
    <div id="sumContent"></div>`;
  drawSummary(scope);

function periodData(scope){
  const v = document.getElementById("sumPeriod").value;
  const works = (DB.workLogs||[]).filter(x=>x.date.startsWith(v) && (x.content||x.place||x.mileage));
  return {v, works,
    weathers: (scope==="month"?DB.weathers:DB.weathers).filter(x=>x.date.startsWith(v)),
    miles: DB.mileages.filter(x=>x.date.startsWith(v)),
    subs: DB.subsidies.filter(x=>x.date.startsWith(v))};
}
function drawSummary(scope){
  const {v, works, weathers, miles, subs} = periodData(scope);
  const subTotal = subs.reduce((s,x)=>s+Number(x.amount||0),0);
  const days = new Set(works.map(x=>x.date)).size;
  // 周期行驶里程 = 本周期最后读数 - 上一周期最后读数
  const allMiles = DB.mileages.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let km = "0";
  if(allMiles.length){
    const inPeriod = allMiles.filter(x=>x.date.startsWith(v));
    if(inPeriod.length){
      const lastKm = Number(inPeriod[inPeriod.length-1].km);
      const before = allMiles.filter(x=>x.date < v+"-01");
      const base = before.length ? Number(before[before.length-1].km) : Number(inPeriod[0].km);
      km = (lastKm - base).toFixed(1);
    }
  }

  // 工作内容汇总
  const workList = works.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>
    `<tr><td>${x.date}</td><td>${esc(x.place||"")}</td><td>${esc(x.content)}</td></tr>`).join("");

  document.getElementById("sumContent").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="label">工作记录</div><div class="num">${works.length}<small> 条</small></div><div class="hint">${days} 个工作日</div></div>
      <div class="stat"><div class="label">行驶里程</div><div class="num">${km}<small> km</small></div><div class="hint">${miles.length} 次记录</div></div>
      <div class="stat"><div class="label">补贴合计</div><div class="num">¥${subTotal}</div><div class="hint">${subs.length} 条登记</div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><div id="mainChart" style="width:100%;height:320px"></div></div>
    <div class="card">
      <h3>完成的工作明细<span class="meta">${works.length} 条</span></h3>
      <table>
        <colgroup><col style="width:15%"><col style="width:25%"><col style="width:60%"></colgroup>
        <tr><th>日期</th><th>地点</th><th>工作内容</th></tr>
        ${workList || '<tr><td colspan="3" class="empty">这个周期还没有记录</td></tr>'}
      </table>
    </div>`;

  // ECharts
  if(typeof echarts === "undefined"){ document.getElementById("mainChart").innerHTML = "<div class='empty'>图表组件未加载</div>"; return; }
  if(chartInst){ try{chartInst.dispose()}catch(e){} }
  chartInst = echarts.init(document.getElementById("mainChart"));
  let categories=[], seriesWorks=[], seriesKm=[];
  if(scope==="month"){
    const daysInMonth = new Date(Number(v.slice(0,4)), Number(v.slice(5,7)), 0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const ds = `${v}-${String(d).padStart(2,"0")}`;
      categories.push(d+"日");
      seriesWorks.push(works.filter(x=>x.date===ds).length);
      const mk = miles.filter(x=>x.date===ds).sort((a,b)=>b.km-a.km)[0];
      seriesKm.push(mk?Number(mk.km):null);
    }
  } else {
    for(let m=1; m<=12; m++){
      const prefix = `${v}-${String(m).padStart(2,"0")}`;
      categories.push(m+"月");
      seriesWorks.push(works.filter(x=>x.date.startsWith(prefix)).length);
      const ms = miles.filter(x=>x.date.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
      seriesKm.push(ms.length?Number(ms[ms.length-1].km):null);
    }
  }
  chartInst.setOption({
    tooltip:{trigger:"axis"},
    legend:{data:["工作记录数","里程表读数(km)"]},
    grid:{left:50,right:50,top:40,bottom:30},
    xAxis:{type:"category",data:categories},
    yAxis:[{type:"value",name:"条"},{type:"value",name:"km"}],
    series:[
      {name:"工作记录数",type:"bar",data:seriesWorks,itemStyle:{color:"#2563eb"}},
      {name:"里程表读数(km)",type:"line",yAxisIndex:1,data:seriesKm,itemStyle:{color:"#16a34a"},connectNulls:true}
    ]
  });
}

    document.getElementById("geoLat").value = pos.coords.latitude.toFixed(4);

    saveGeo();
  }, ()=>alert("定位失败，请手动输入经纬度"));

function wmo2txt(code){
  if(code===0) return "晴";
  if(code<=2) return "晴"; if(code===3) return "多云";
  if(code===45||code===48) return "雾";
  if(code>=51&&code<=67) return "小雨";
  if(code>=61&&code<=67) return "中雨";
  if(code>=80&&code<=82) return "大雨";
  if(code>=95) return "雷雨前";
  return "多云";
}
async function fetchWeather(){
  const g = DB.settings && DB.settings.geo;
  if(!g){ alert("请先点「获取我的位置」或手动填入经纬度并保存"); return; }
  try{
    toast("正在获取天气…");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lng}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&forecast_days=1`;
    const r = await fetch(url);
    const j = await r.json();
    const w = j.daily;
    const cond = wmo2txt(w.weathercode[0]);
    document.querySelector('select[name=morning]').value = cond;
    document.querySelector('select[name=afternoon]').value = cond;
    document.querySelector('input[name=low]').value = w.temperature_2m_min[0].toFixed(0);
    document.querySelector('input[name=high]').value = w.temperature_2m_max[0].toFixed(0);
    toast(`已获取：${cond} ${w.temperature_2m_min[0].toFixed(0)}~${w.temperature_2m_max[0].toFixed(0)}℃，确认后点保存`);
  }catch(e){ alert("获取失败（需要联网）："+e.message); }
}

/* 解析批次名中的月份：返回 {y,m} 或 null */
function batchMonth(b){
  const s = b.name || "";
  let m = s.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月/);
  if(m) return {y:+m[1], m:+m[2]};
  m = s.match(/(\d{1,2})\.(\d{1,2})/);
  if(m && +m[1]>=1 && +m[1]<=12) return {y:2026, m:+m[1]};
  return null;
}
/* 批次名统一显示为完整月日：2.24-25 → 2月24日-2月25日；8.11-8.20 → 8月11日-8月20日 */
function fmtWageName(b){
  const n = b.name || "";
  const m = n.match(/^(\d{1,2})\.(\d{1,2})-(\d{1,2})(?:\.(\d{1,2}))?\.?$/);
  if(!m) return n;
  const m1=+m[1], d1=+m[2];
  let m2, d2;
  if(m[4]){ m2=+m[3]; d2=+m[4]; } else { m2=m1; d2=+m[3]; }
  return m1+"月"+d1+"日-"+m2+"月"+d2+"日";
}

function addWageBatch(){
  const name = prompt("批次名称（如：2026年10月 孟农苗圃 日工 10.1-10.10）");
  if(!name) return;
  const kind = confirm("点确定=日工（按天计），点取消=计件工（按件计）") ? "日工" : "计件";
  const rate = prompt(kind==="日工" ? "日工资（基普/天，默认150000）" : "计件单价（基普/件，默认3500）");
  DB.wageBatches.push({id:"wage_"+Date.now(), name, range:"", kind, rate: rate?Number(rate):(kind==="日工"?150000:3500), totalDays:0, totalAmt:0, records:[]});
  save(); renderWage();
}
function delWageBatch(id){ if(confirm("删除整个批次？")){ DB.wageBatches = DB.wageBatches.filter(b=>b.id!==id); save(); renderWage(); } }
function moveWageBatch(id, dir){
  const i = DB.wageBatches.findIndex(x=>x.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=DB.wageBatches.length) return;
  const t = DB.wageBatches[i]; DB.wageBatches[i]=DB.wageBatches[j]; DB.wageBatches[j]=t;
  save(); renderWage();
}
function editWageBatch(id){
  const b = DB.wageBatches.find(x=>x.id===id); if(!b) return;
  const name = prompt("批次名称（建议含日期范围，如：3.3-3.11 日工）", b.name);
  if(name===null) return;
  const kind = confirm(`当前类型：${b.kind==="计件"?"计件工":"日工"}。点「确定」保持${b.kind==="计件"?"计件工":"日工"}，点「取消」切换为${b.kind==="计件"?"日工":"计件工"}`);
  const rate = prompt("日工资/计件单价（基普），改完后天数/件数不变，金额不变", b.rate);
  b.name = (name||"").trim() || b.name;
  b.kind = kind ? "日工" : "计件";
  if(rate && !isNaN(Number(rate))) b.rate = Number(rate);
  save(); renderWage();
}
function editWageRec(batchId, i){
  const b = DB.wageBatches.find(x=>x.id===batchId); if(!b) return;
  const r = b.records[i]; if(!r) return;
  const lao = prompt("老语姓名", r.lao||""); if(lao===null) return;
  const zh = prompt("中文姓名", r.name||""); if(zh===null) return;
  const v = prompt("村", r.village||""); if(v===null) return;
  const d = prompt(b.kind==="计件"?"件数（改完按单价自动重算金额）":"天数（改完按单价自动重算金额）", r.days); if(d===null) return;
  const dd = parseFloat(d); if(isNaN(dd)||dd<=0){ alert("天数/件数无效"); return; }
  const rate = b.rate || (b.kind==="计件"?3500:150000);
  const newAmt = Math.round(dd*rate);
  b.totalDays = Math.round((b.totalDays - r.days + dd)*10)/10;
  b.totalAmt = b.totalAmt - r.amount + newAmt;
  r.lao = (lao||"").trim(); r.name = (zh||"").trim(); r.village = (v||"").trim(); r.days = dd; r.amount = newAmt;
  save(); renderWage();
}
function addWageRec(id){
  const b = DB.wageBatches.find(x=>x.id===id); if(!b) return;
  const lao = document.getElementById("wgLao").value.trim();
  const zh = document.getElementById("wgZh").value.trim();
  const v = document.getElementById("wgV").value.trim();
  const d = parseFloat(document.getElementById("wgD").value);
  if(!zh || isNaN(d) || d<=0){ alert("请填中文姓名和天数/件数"); return; }
  const rate = b.rate || (b.kind==="计件"?3500:150000);
  const amt = Math.round(d * rate);
  b.records.push({lao, name:zh, village:v, days:d, amount:amt});
  b.totalDays = Math.round((b.totalDays + d)*10)/10;
  b.totalAmt = b.totalAmt + amt;
  save(); renderWage();
}
function delWageRec(id, i){
  const b = DB.wageBatches.find(x=>x.id===id); if(!b) return;
  if(!confirm("删除这条考勤？")) return;
  const r = b.records[i]; b.records.splice(i,1);
  b.totalDays = Math.round((b.totalDays - r.days)*10)/10;
  b.totalAmt = b.totalAmt - r.amount;
  save(); renderWage();
}
function exportWageExcel(){
  if(typeof XLSX === "undefined"){ alert("Excel 组件未加载"); return; }
  const wb = XLSX.utils.book_new();
  DB.wageBatches.forEach(b=>{
    const aoa = [[`太阳纸业控股老挝有限责任公司考勤表  ${b.name}`], ["老语","中文","村",b.kind==="计件"?"件数":"天数","金额(基普)"]];
    b.records.forEach(r=>aoa.push([r.lao||"", r.name||"", r.village||"", r.days, r.amount]));
    aoa.push(["合计","","",b.totalDays,b.totalAmt]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), (b.name||"批次").slice(0,28));
  });
  const sum = [["批次","类型","范围","总天数/件数","总金额(基普)"], ...DB.wageBatches.map(b=>[b.name,b.kind,b.range||"",b.totalDays,b.totalAmt])];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), "批次汇总");
  XLSX.writeFile(wb, "考勤发薪汇总.xlsx");
  toast("考勤 Excel 已导出");
}

const MAT_FIELDS = {

/* ===== 物资台账：筛选条件匹配 ===== */
function matFMatch(r){
  if(matF.region && r.region!==matF.region) return false;
  if(matF.forest && r.forest!==matF.forest) return false;
  if(matF.kw){
    const kw = matF.kw.toLowerCase();
    const hay = [r.region, r.forest, r.block, r.code, r.village, r.farmer, r.material, r.spec, r.place, r.contractor].join(" ").toLowerCase();
    if(!hay.includes(kw)) return false;
  }
  return true;
}
function matFilterBar(){
  const all = [].concat(DB.fertilizerUsage, DB.fertilizerIssue, DB.fertilizerStock, DB.herbicideStock, DB.herbicideUsage, DB.seedlingUsage);
  const regions = [...new Set(all.map(r=>r.region).filter(Boolean))].sort();
  const forests = [...new Set(all.map(r=>r.forest).filter(Boolean))].sort();
  return `<div class="card" style="padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span style="font-size:13px;color:var(--sub)">筛选：</span>
    <select onchange="matF.region=this.value;renderMaterial()" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
      <option value="">全部林区</option>${regions.map(r=>`<option ${matF.region===r?"selected":""}>${esc(r)}</option>`).join("")}</select>
    <select onchange="matF.forest=this.value;renderMaterial()" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
      <option value="">全部林场</option>${forests.map(f=>`<option ${matF.forest===f?"selected":""}>${esc(f)}</option>`).join("")}</select>
    <input id="matKw" placeholder="搜索林班/代码/种植户/物料…" value="${esc(matF.kw)}" onkeydown="if(event.key==='Enter'){matF.kw=this.value.trim();renderMaterial()}" style="flex:1;min-width:180px;padding:6px 8px;border:1px solid var(--line);border-radius:6px">
    <button class="btn" onclick="matF.kw=document.getElementById('matKw').value.trim();renderMaterial()">搜索</button>
    <button class="btn" onclick="matF={region:'',forest:'',kw:''};renderMaterial()">清除</button>
  </div>`;
}
function renderMaterial(){
  const tabs = [["overview","总览"],["fertilizerUsage","肥料使用"],["fertilizerIssue","合作林发放"],["fertilizerStock","肥料库存"],["herbicideStock","除草剂库存"],["herbicideUsage","除草剂使用"],["seedlingUsage","苗木使用"]];
  view.innerHTML = `
    <div class="topbar"><h1>物资台账</h1>
      <div class="btns">
        ${tabs.map(t=>`<button class="btn ${matTab===t[0]?"primary":""}" onclick="matTab='${t[0]}';renderMaterial()">${t[1]}</button>`).join("")}
        <button class="btn primary" onclick="document.getElementById('matFile').click()">导入 Excel</button>
        <input type="file" id="matFile" accept=".xlsx,.xls" style="display:none" onchange="importMaterialExcel(this)">
      </div></div>
    ${matFilterBar()}`;
  if(matTab==="overview") matOverview();
  else if(matTab==="fertilizerUsage") matFertUse();
  else if(matTab==="fertilizerIssue") matFertIssue();
  else if(matTab==="fertilizerStock") matStock(DB.fertilizerStock, "fertilizerStock");
  else if(matTab==="herbicideStock") matStock(DB.herbicideStock, "herbicideStock");

/* ===== 总览：库存种类+存放点 / 地块施肥量 / 苗木汇总 ===== */
function matOverview(){
  const fs = DB.fertilizerStock, hs = DB.herbicideStock;
  const stockMap = {};
  fs.forEach(r=>{ const k="肥料|"+r.material+"|"+(r.spec||"-"); (stockMap[k]=stockMap[k]||{kind:"肥料",material:r.material,spec:r.spec||"-",total:0,spots:[]}).total+=Number(r.stock||0); (stockMap[k].spots).push((r.place||"")+" "+(r.stock||0)+"袋"); });
  hs.forEach(r=>{ const k="除草剂|"+r.material+"|"+(r.spec||"-"); (stockMap[k]=stockMap[k]||{kind:"除草剂",material:r.material,spec:r.spec||"-",total:0,spots:[]}).total+=Number(r.stock||0); (stockMap[k].spots).push((r.place||"")+" "+(r.stock||0)+"箱"); });
  const fert = DB.fertilizerUsage.filter(matFMatch);
  const plotMap = {};
  fert.forEach(r=>{ const k=r.region+"|"+r.forest+"|"+r.block; plotMap[k]=plotMap[k]||{region:r.region,forest:r.forest,block:r.block,ton:0}; plotMap[k].ton+=Number(r.usage||0); });
  const plots = Object.values(plotMap).sort((a,b)=>b.ton-a.ton);

/* 自动识别表格类型：看表头特征词 + 物料内容样例 */
function detectMaterialType(rows, headIdx, head){
  const hs = head.map(h=>String(h||"").replace(/\s+/g,"")).filter(Boolean);
  const has = (...ks)=>ks.some(k=>hs.some(h=>h.includes(k)));
  if(has("包商","承包商")) return "herbicideUsage";            // 除草剂使用：包商独有
  if(has("袋数","种植户","农户")) return "fertilizerIssue";   // 合作林发放：种植户/袋数独有
  if(has("库存","结存")){                                // 库存类：看是肥料还是除草剂
    if(has("除草剂")) return "herbicideStock";
    if(has("肥料")) return "fertilizerStock";
    const mi = hs.findIndex(x=>x.includes("物料")||x.includes("品名"));
    if(mi>=0){
      const sample = rows.slice(headIdx+1, headIdx+8).map(r=>String(r[mi]||"")).join("");
      if(/草甘膦|除草剂|草铵膦|百草枯/.test(sample)) return "herbicideStock";
      if(/复合肥|尿素|钙镁磷|磷酸/.test(sample)) return "fertilizerStock";
    }
    return "fertilizerStock";
  }
  if(has("使用量","用量")){                              // 使用类：看物料样例
    const mi = hs.findIndex(x=>x.includes("物料")||x.includes("品名")||x.includes("除草剂")||x.includes("肥料"));
    if(mi>=0){
      const sample = rows.slice(headIdx+1, headIdx+8).map(r=>String(r[mi]||"")).join("");
      if(/草甘膦|除草剂|草铵膦|百草枯/.test(sample)) return "herbicideUsage";
    }
    return "fertilizerUsage";
  }
  if(has("数量","株数")) return "seedlingUsage";              // 苗木使用：数量独有
  return null;
}
function importMaterialExcel(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      // 定位表头行
      let headIdx = -1;
      for(let r=0; r<rows.length && r<10; r++){
        if(String(rows[r][0]||"").includes("林区") || String(rows[r][1]||"").includes("林场")){ headIdx=r; break; }
      }
      if(headIdx<0){ alert("没找到表头行（第一列应为林区）"); return; }
      const head = rows[headIdx];
      // 自动识别表类型；识别不出才让用户手动选
      let target = detectMaterialType(rows, headIdx, head);
      if(!target){
        const pick = prompt("没自动识别出表格类型，请手动输入要导入到哪个表（肥料使用 / 合作林发放 / 肥料库存 / 除草剂库存 / 除草剂使用 / 苗木使用）", "");
        if(!pick) return;
        target = Object.keys(MAT_IMPORT_MAP).find(k=>MAT_IMPORT_MAP[k].label===pick.trim());
        if(!target){ alert("表名没识别出来，请按提示输入完整名称"); return; }
      }
      const cfg = MAT_IMPORT_MAP[target];
      // 列映射：按候选词模糊匹配（兼容 清山面积/面积、袋数/数量、株数/数量 等叫法）
      const colIdx = {};
      cfg.cols.forEach((c,ci)=>{
        const cands = cfg.cands[c] || [c];
        const ci2 = head.findIndex(hh=>{ const hs=String(hh||"").replace(/\s+/g,""); return cands.some(cd=>hs.includes(cd)); });
        if(ci2>=0) colIdx[c]=ci2;
      });
      let added = 0, skipped = 0;
      for(let r=headIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c||"").trim()==="")) continue;
        const rec = {};
        cfg.cols.forEach(c=>{
          const ci = colIdx[c];
          let v = ci===undefined ? "" : String(row[ci]||"").trim();
          if(cfg.num.includes(c)){ v = parseFloat(v); if(isNaN(v)) v=0; }
          rec[c] = v;
        });
        if(!rec[cfg.cols[0]] && !rec[cfg.cols[2]]){ skipped++; continue; }  // 首行或林班都空则跳过
        DB[target].push(rec); added++;
      }
      save(); renderMaterial();
      alert(`已自动识别为「${cfg.label}」表并导入：新增 ${added} 条${skipped?`，跳过 ${skipped} 条空行`:""}`);
    }catch(e){ alert("导入失败："+e.message); }
  };
  reader.readAsArrayBuffer(file);
  input.value = "";
}

/* 林地 Excel 导入：自动识别自营林/合作林 */
function importForestExcel(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:""});
      let headIdx = -1;
      for(let r=0; r<rows.length && r<10; r++){
        if(String(rows[r][0]||"").includes("林区")){ headIdx=r; break; }
      }
      if(headIdx<0){ alert("没找到表头行（第一列应为林区）"); return; }
      const head = rows[headIdx];
      const hs = head.map(x=>String(x||"").replace(/\\s+/g,""));
      const isCoop = hs.some(x=>x.includes("种植户")) || hs.some(x=>x.includes("合作模式"));
      const tab = isCoop ? "coop" : "owned";
      const coll = isCoop ? "forestCoop" : "forestOwned";
      const fields = FOREST_FIELDS[tab];
      // 列映射（按候选词）
      const cands = {
        region:["林区"], forest:["林场"], block:["林班","地块"], code:["林班代码","代码"],
        county:["县"], village:["村"], farmer:["种植户","农户"], mode:["合作模式"],
        oldCode:["旧林班代码","旧代码"], newCode:["新林班代码","新代码"],
        area:["种植面积","面积"], year:["种植年份","年份"],
        terrain:["山地/平地","山地","平地"], areaA:["A类面积"], areaB:["B类面积"], areaC:["C类面积"], areaD:["D类面积"],
        manager:["林区经理"], mgrPhone:["联系方式"], fieldMgr:["林场场长"], fieldPhone:["联系方式"], admin:["现场管理员"], adminPhone:["联系方式"],
        process:["作业工序"], progress:["进度"], accept:["验收情况"]
      };
      const colIdx = {};
      fields.forEach(fd=>{
        const cand = cands[fd.k] || [fd.k];
        const ci = head.findIndex(hh=>{ const s=String(hh||"").replace(/\\s+/g,""); return cand.some(c=>s.includes(c)); });
        if(ci>=0) colIdx[fd.k]=ci;
      });
      let added=0, skipped=0, other=0;
      for(let r=headIdx+1; r<rows.length; r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c||"").trim()==="")) continue;
        const rec = {};
        let hasData = false;
        fields.forEach(fd=>{
          const ci = colIdx[fd.k];
          let v = ci===undefined ? "" : String(row[ci]||"").trim();
          if(FOREST_NUM[tab].includes(fd.k)){ v = parseFloat(v); if(isNaN(v)) v=0; else hasData=true; }
          if(v!=="") hasData = true;
          rec[fd.k] = v;
        });
        if(!hasData){ skipped++; continue; }
        if(rec.region && rec.region!=="色奔东林区" && rec.region!=="班东林区" && rec.region!==""){ other++; }
        if(rec.region==="班东林区") rec.region = "色奔东林区";
        DB[coll].push(rec); added++;
      }
      save(); renderForest();
      alert(`已识别为「${tab==="coop"?"合作林":"自营林"}」表并导入 ${added} 条${skipped?`，跳过 ${skipped} 条空行`:""}${other?`，另有 ${other} 条非色奔东/班东林区的数据也已导入（可在林区列查看）`:""}`);
    }catch(e){ alert("导入失败："+e.message); }
  };
  reader.readAsArrayBuffer(file);
  input.value = "";
}

        <div class="field"><label>状态</label><select name="done"><option value="1">已完成</option><option value="0">进行中</option></select></div>
        <div class="field" style="align-self:end"><button class="btn primary" type="submit">保存记录</button></div>
      </form>
    </div>
    <div class="card">
      <h3>本月记录<span class="meta">${+cur.slice(5,7)}月 ${monthRecs.length} 天</span></h3>
      <table>
        <colgroup><col style="width:11%"><col style="width:15%"><col style="width:12%"><col style="width:40%"><col style="width:12%"><col style="width:10%"></colgroup>
        <tr><th>日期</th><th>工作地点</th><th>车辆里程</th><th>工作内容</th><th>状态</th><th></th></tr>
        ${monthRecs.map(r=>{
          const gi = DB.workLogs.indexOf(r);
          const d = r.date.split("-");
          if(wlEdit && wlEdit.i===gi) return `<tr><td colspan="6" style="padding:10px 4px">${wlForm(gi)}</td></tr>`;
          return `<tr>
            <td>${+d[1]}月${+d[2]}日</td>
            <td>${esc(r.place||"—")}</td>
            <td>${esc(r.mileage||"—")}</td>
            <td style="white-space:pre-wrap">${esc(r.content||"")}</td>
            <td>${r.done?'<span class="pill ok">完成</span>':'<span class="pill wait">进行中</span>'}</td>
            <td><button class="btn" onclick="wlEdit={i:${gi}};renderWork()">改</button>
                <button class="btn danger" onclick="delRec('workLogs',${gi})">删</button></td>
          </tr>`;
        }).join("") || '<tr><td colspan="6" class="empty">本月还没有记录，上面填一条吧</td></tr>'}
      </table>
      <div style="font-size:12px;color:var(--sub);margin-top:6px">每天的记录自动进入下方「工作日志（历史档案）」，月底一键导出 Excel。</div>
    </div>
    <div class="card">
      <div class="km-bar" style="cursor:pointer;user-select:none" onclick="workLogOpen=!workLogOpen;renderWork()">工作日志（历史档案）<span style="float:right;font-weight:400;font-size:12px">${workLogOpen?"▲ 收起":"▼ 点击展开"}</span></div>
      ${workLogOpen ? wlSection() : ""}
    </div>`;
  // 多选样式切换
  document.querySelectorAll("#locPick label").forEach(lb=>{
    lb.addEventListener("click", e=>{ e.preventDefault(); const cb=lb.querySelector("input"); cb.checked=!cb.checked; lb.classList.toggle("on", cb.checked); });
  });
}
function addWorkLog(e){
  e.preventDefault(); const f = e.target;
  const locs = [...f.querySelectorAll("input[name=loc]:checked")].map(c=>c.value);
  (f.locOther.value||"").split(/[、,，\s]+/).forEach(s=>{ if(s) locs.push(s); });
  const date = f.date.value;
  const rec = {date, place:locs.join("、"), mileage:f.mileage.value.trim(), content:f.content.value.trim(), done:f.done.value==="1"};
  const ex = DB.workLogs.findIndex(x=>x.date===date);
  if(ex>=0){ DB.workLogs[ex] = Object.assign({}, DB.workLogs[ex], rec); toast("已更新当天记录"); }
  else { DB.workLogs.push(rec); toast("已保存"); }
  syncKmBoth(rec.date, rec.mileage);
  save(); renderWork();
}
/* 工作日志子板块：展开后显示（月份筛选 + 导出 + 完整表格；"全部月份"视图不含当月，当月在上面"本月记录"查看） */
function wlSection(){
  const curMonth = monthStr();
  const list = DB.workLogs.slice().sort((a,b)=>a.date.localeCompare(b.date))
    .filter(r=> wlMonth!=="all" ? r.date.startsWith(wlMonth) : !r.date.startsWith(curMonth));
  const months = [...new Set(list.map(x=>x.date.slice(0,7)))].sort();
  return `
    <div style="margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select onchange="wlMonth=this.value;renderWork()" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px">
        <option value="all">全部月份</option>${months.map(m=>`<option ${wlMonth===m?"selected":""}>${m}</option>`).join("")}</select>
      <button class="btn primary" onclick="exportWorkLogExcel()">导出 Excel（公司模板）</button>
      <span style="font-size:12px;color:var(--sub)">每月里程一览请到「摩托车里程」查看</span>
    </div>
    <table>
      <colgroup><col style="width:13%"><col style="width:17%"><col style="width:11%"><col style="width:50%"><col style="width:9%"></colgroup>
      <tr><th>日期</th><th>工作地点</th><th>车辆里程</th><th>主要工作内容</th><th></th></tr>
      ${list.map(r=>{
        if(wlMonth!=="all" && r.date.slice(0,7)!==wlMonth) return "";
        const gi = DB.workLogs.indexOf(r);
        if(wlEdit && wlEdit.i===gi) return `<tr><td colspan="5" style="padding:10px 4px">${wlForm(gi)}</td></tr>`;
        const d = r.date.split("-");
        return `<tr>
          <td>${+d[1]}月${+d[2]}日</td>
          <td>${esc(r.place||"—")}</td>
          <td>${esc(r.mileage||"—")}</td>
          <td style="white-space:pre-wrap">${esc(r.content||"")}</td>
          <td><button class="btn" onclick="wlEdit={i:${gi}};renderWork()">改</button>
              <button class="btn danger" onclick="delRec('workLogs',${gi})">删</button></td>
        </tr>`;
      }).join("") || '<tr><td colspan="5" class="empty">该月份暂无记录</td></tr>'}
    </table>`;
}
function wlPickLoc(loc, form){
  const inp = form.querySelector('input[name=place]');
  const cur = (inp.value||"").split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  if(cur.includes(loc)) inp.value = cur.filter(x=>x!==loc).join("、");
  else { cur.push(loc); inp.value = cur.join("、"); }
}
function wlForm(i){
  const r = i>=0 ? DB.workLogs[i] : {date:todayStr(),place:"",mileage:"",content:"",weather:""};
  return `<div style="background:#f8fafc;border:1px dashed var(--line);border-radius:8px;padding:12px 10px;margin-bottom:4px">
    <form onsubmit="wlSave(event,${i})" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end">
      <div class="field" style="margin:0"><label>日期</label><input type="date" name="date" value="${r.date}" required></div>
      <div class="field" style="margin:0"><label>工作地点</label><input name="place" value="${esc(r.place)}" placeholder="点选或手动输入" style="width:150px"></div>
      <div class="field" style="margin:0"><label>车辆里程</label><input name="mileage" value="${esc(r.mileage)}" placeholder="如：29813" style="width:100px"></div>
      <div class="field" style="margin:0"><label>天气(选填)</label><input name="weather" value="${esc(r.weather)}" placeholder="如：晴" style="width:100px"></div>
      <div class="field" style="margin:0;flex:1;min-width:220px"><label>主要工作内容</label><textarea name="content" rows="2" style="width:100%">${esc(r.content)}</textarea></div>
      <button class="btn primary" type="submit">保存</button>
      <button type="button" class="btn" onclick="wlEdit=null;renderWork()">取消</button>
    </form>
    <div style="margin-top:6px;font-size:12px;color:var(--sub)">常用地点：
      ${["班东","色奔","中心苗圃","孟农","公司"].map(l=>`<button type="button" class="btn" style="padding:2px 10px;margin-right:6px" onclick="wlPickLoc('${l}',this.form)">${l}</button>`).join("")}
    </div></div>`;
}
function wlSave(e, i){
  e.preventDefault(); const f = e.target;
  const rec = {date:f.date.value, place:f.place.value.trim(), mileage:f.mileage.value.trim(),
    content:f.content.value.trim(), weather:f.weather.value.trim(),
    done: i>=0 ? !!(DB.workLogs[i]&&DB.workLogs[i].done) : false};
  if(i>=0) DB.workLogs[i] = rec; else DB.workLogs.push(rec);
  syncKmBoth(rec.date, rec.mileage);
  wlEdit = null; save(); renderWork();
}
/* 导出：复刻公司《考核部外勤工作日志》模板，每月一个 sheet，3天一组 */
function exportWorkLogExcel(){
  const list = DB.workLogs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ alert("暂无工作日志可导出"); return; }
  const months = [...new Set(list.map(x=>x.date.slice(0,7)))].sort();
  const wb = XLSX.utils.book_new();
  months.forEach(ym=>{
    const ms = list.filter(x=>x.date.startsWith(ym));
    const aoa = [["考核部外勤工作日志","",""], ["姓名：刘琪伟","区域/岗位名称：合作部考核员","上级直接主管：杜国平"]];
    for(let g=0; g<ms.length; g+=3){
      const grp = ms.slice(g, g+3);
      const fmtd = grp.map(r=>{
        const p = r.date.split("-");
        return "日期:" + (+p[0]) + "年  " + (+p[1]) + "月" + (+p[2]) + "日";
      });
      while(fmtd.length<3) fmtd.push("");
      aoa.push(fmtd);
      const plc = grp.map(r=>"工作地点："+(r.place||""));
      while(plc.length<3) plc.push("");
      aoa.push(plc);
      if(grp.some(r=>r.weather)){
        const wt = grp.map(r=>"天气情况："+(r.weather||""));
        while(wt.length<3) wt.push("");
        aoa.push(wt);
      }
      const km = grp.map(r=>"车辆里程："+(r.mileage||""));
      while(km.length<3) km.push("");
      aoa.push(km);
      const ct = grp.map(r=>"主要工作内容："+(r.content||""));
      while(ct.length<3) ct.push("");
      aoa.push(ct);
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:32},{wch:32},{wch:32}];
    ws["!rows"] = [{hpt:22},{hpt:18}];
    XLSX.utils.book_append_sheet(wb, ws, (+ym.split("-")[1])+"月");
  });
  XLSX.writeFile(wb, "考核部外勤工作日志-刘琪伟2026.xlsx");
  toast("已导出 Excel（每月一个表）");
}

/* ================= 常用语库 ================= */
const PHRASE_SEED = [
  {text:"参与苗圃临时工工资发放，共计___个工，发放工资___万基普，已核对用工考勤无误。", category:"工资"},
  {text:"整理本月工作日志、验收表、验收照片等资料发送办公室。", category:"资料"},
  {text:"巡查___林场，检查整改点___，复查整改完成情况。", category:"巡查"},
  {text:"参与___林班施肥作业，使用复合肥___吨。", category:"生产"},
  {text:"清点并焚烧肥料袋___个、除草剂瓶___个，并做好台账记录。", category:"清点"},
  {text:"跟进___林场除草剂使用，使用草甘膦___箱。", category:"生产"}
];
function renderPhrases(){
  const list = DB.phrases;
  if(!list.length){ DB.phrases = PHRASE_SEED.map(p=>({...p})); save(); }
  view.innerHTML = `
    <div class="topbar"><h1>常用语库</h1>
      <div class="btns"><button class="btn primary" onclick="addPhrase()">新增常用语</button></div></div>
    <div class="card">
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px">点击条目复制，回到「工作日志 / 每日汇报」直接粘贴；带 ___ 的位置自己填数字。</div>
      ${DB.phrases.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--blue-soft)">
        <span class="meta">${esc(p.category||"通用")}</span>
        <span style="flex:1">${esc(p.text)}</span>
        <button class="btn" onclick="copyPhrase(${i})">复制</button>
        <button class="btn danger" onclick="delRec('phrases',${i})">删</button>
      </div>`).join("")}
    </div>`;
}
function addPhrase(){
  const text = prompt("输入常用语（可用 ___ 占位）");
  if(!text) return;
  const category = prompt("分类（如：工资/资料/巡查/生产/清点，回车跳过）")||"通用";
  DB.phrases.push({text, category}); save(); renderPhrases();
}
function copyPhrase(i){
  navigator.clipboard.writeText(DB.phrases[i].text).then(()=>toast("已复制")).catch(()=>toast("复制失败，请手动选择"));
}

/* ================= 启动 ================= */
window.addEventListener("hashchange", route);
route();

</script>
